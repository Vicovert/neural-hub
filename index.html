<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural Dev Hub — Cerveau 3D & Pilotage Git</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three-spritetext@1.8.2/dist/three-spritetext.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030712;
      color: #f3f4f6;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #3d-graph {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    .glass {
      background: rgba(11, 17, 32, 0.86);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.24);
      box-shadow: 0 0 35px rgba(14, 165, 233, 0.14);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.4); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.7); }
  </style>
</head>
<body>

  <!-- Scène WebGL du Cerveau 3D -->
  <div id="3d-graph"></div>

  <!-- Barre supérieure HUD -->
  <header class="fixed top-3 left-3 right-3 z-20 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
    <div class="glass px-4 py-2 rounded-xl flex items-center gap-3 pointer-events-auto">
      <div class="flex items-center gap-2">
        <span class="relative flex h-3 w-3">
          <span id="status-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
          <span id="status-dot" class="relative inline-flex rounded-full h-3 w-3 bg-cyan-500"></span>
        </span>
        <span class="font-bold tracking-wider text-xs uppercase text-cyan-400">Neural Dev Hub V5.4</span>
      </div>
      <div class="h-4 w-[1px] bg-slate-700"></div>
      <span id="stats-counter" class="text-xs text-slate-300">En attente de clés...</span>
      <span id="scopes-badge" class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 hidden"></span>
      <button onclick="loadAllRepositories()" class="text-xs bg-slate-800 hover:bg-slate-700 text-cyan-300 px-2.5 py-1 rounded border border-cyan-500/30 transition">
        Rafraîchir 3D
      </button>
      <button onclick="resetCamera()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded border border-slate-700 transition">
        Recentre
      </button>
    </div>

    <div class="glass px-3.5 py-2 rounded-xl flex flex-wrap items-center gap-2.5 pointer-events-auto">
      <label class="text-xs text-slate-400">Agent :</label>
      <select id="agent-selector" class="bg-slate-900 text-xs text-cyan-300 border border-cyan-500/30 rounded px-2.5 py-1 focus:outline-none">
        <option value="gemini:gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (Gratuit / Haut Quota)</option>
        <option value="gemini:gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite (Gratuit / Rapide)</option>
        <option value="gemini:gemini-4-hydrogen">Gemini 4 Hydrogen (Gratuit / Quotidien)</option>
        <option value="groq:llama-3.1-8b-instant">Groq — Llama 3.1 8B Instant</option>
        <option value="groq:openai/gpt-oss-120b">Groq — GPT-OSS 120B</option>
        <option value="groq:meta-llama/llama-4-maverick-17b-128e-instruct">Groq — Llama 4 Maverick 17B</option>
        <option id="ollama-opt" value="ollama:deepseek-r1:32b" disabled>Ollama Local (Non détecté)</option>
      </select>

      <button onclick="toggleNewProjectDrawer()" class="text-xs bg-cyan-600 hover:bg-cyan-500 text-white font-semibold px-3 py-1.5 rounded-lg shadow transition">
        + Nouveau Projet par Prompt
      </button>

      <button onclick="toggleSettingsDrawer()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-600 transition">
        Clés & Sécurité
      </button>
    </div>
  </header>

  <!-- Tiroir Configuration & Sécurité -->
  <aside id="settings-drawer" class="fixed top-16 right-3 z-30 w-96 max-w-[94vw] glass rounded-2xl p-5 hidden">
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-xs font-bold uppercase tracking-wider text-cyan-400">Clés API & Sécurité</h2>
      <button onclick="toggleSettingsDrawer()" class="text-slate-400 hover:text-white text-sm">✕</button>
    </div>
    <p class="text-[11px] text-slate-400 mb-3">
      Sur un PC qui n'est pas le tien, garde le mode <b>Session (Onglet)</b> : les clés disparaissent dès que tu fermes l'onglet.
    </p>
    <div class="space-y-2.5 text-xs">
      <div>
        <label class="block text-slate-300 mb-1">Mode de stockage des clés</label>
        <select id="cfg-storage-mode" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-white">
          <option value="session">Session (PC tiers — effacé à la fermeture de l'onglet)</option>
          <option value="local">Persistant (Mon PC personnel — localStorage)</option>
        </select>
      </div>
      <div>
        <label class="block text-slate-300 mb-1">Utilisateur GitHub (optionnel : auto-détecté via Token)</label>
        <input id="cfg-owner" type="text" placeholder="Vicovert" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-white focus:border-cyan-400 focus:outline-none" />
      </div>
      <div>
        <label class="block text-slate-300 mb-1">GitHub Personal Access Token (coches: <code>repo</code> + <code>workflow</code>)</label>
        <input id="cfg-github-token" type="password" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-white focus:border-cyan-400 focus:outline-none" />
      </div>
      <div>
        <label class="block text-slate-300 mb-1">Clé Google Gemini (AI Studio)</label>
        <input id="cfg-gemini-key" type="password" placeholder="AIzaSyXXXXXXXXXXXXXXXXXX" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-white focus:border-cyan-400 focus:outline-none" />
      </div>
      <div>
        <label class="block text-slate-300 mb-1">Clé Groq API (Optionnel — secours)</label>
        <input id="cfg-groq-key" type="password" placeholder="gsk_xxxxxxxxxxxxxxxxxxxx" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-white focus:border-cyan-400 focus:outline-none" />
      </div>
      <div class="flex items-center gap-2 pt-2">
        <button onclick="saveCredentials()" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-2 rounded-lg transition">
          Enregistrer & Connecter
        </button>
        <button onclick="clearCredentials()" class="bg-rose-900/80 hover:bg-rose-700 text-rose-200 px-3 py-2 rounded-lg border border-rose-500/40 transition">
          Purger
        </button>
      </div>
    </div>
  </aside>

  <!-- Script principal modulaire -->
  <script type="module" src="app.js"></script>
</body>
</html>
