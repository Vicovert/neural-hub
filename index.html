<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEURAL DEV HUB // V6.0 AUTONOMOUS</title>
  <link rel="stylesheet" href="./style.css?v=6.0" id="main-stylesheet" />
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
</head>
<body>
  <!-- BANNIÈRE D'AUTO-DIAGNOSTIC (Invisible si style.css et app.js chargent normalement) -->
  <div id="boot-diag" style="display:none; background:#7f1d1d; color:#fff; padding:12px 18px; font-family:monospace; font-size:13px; border-bottom:2px solid #ef4444; z-index:9999;"></div>

  <header id="topbar">
    <div class="brand">
      <span class="pulse-dot"></span>
      <h1>NEURAL DEV HUB <span class="badge">V6.0 XML-ENGINE</span></h1>
    </div>

    <div class="top-controls">
      <label class="ctrl-group">
        <span>Modèle Codeur :</span>
        <select id="agent-model-select">
          <option value="gemini-2.5-pro" selected>Gemini 2.5 Pro (Architecte & Gros Code)</option>
          <option value="gemini-2.5-flash">Gemini 2.5 Flash (Rapide & Chirurgical)</option>
          <option value="gemini-1.5-pro">Gemini 1.5 Pro (Fallback Stable)</option>
        </select>
      </label>

      <label class="ctrl-group checkbox-lbl" title="Lit les logs d'erreur GitHub Actions et corrige le code automatiquement jusqu'à validation">
        <input type="checkbox" id="auto-heal-toggle" checked />
        <span>Auto-Heal CI/CD (Max 3 cycles)</span>
      </label>

      <button id="btn-center-cortex" class="btn-secondary">🎯 Pivot Cortex</button>
      <button id="btn-open-settings" class="btn-secondary">⚙️ Clés API</button>
    </div>
  </header>

  <main id="viewport">
    <div id="graph-3d"></div>

    <aside id="project-hud" class="hidden">
      <div class="hud-header">
        <div class="hud-title-row">
          <h2 id="hud-repo-title">Nom du Projet</h2>
          <span id="hud-repo-branch" class="sub-badge">main</span>
          <span id="hud-ci-badge" class="ci-badge ci-neutral">CI: Inconnu</span>
        </div>
        <button id="btn-close-hud" class="btn-icon">✕</button>
      </div>

      <div class="hud-section">
        <div class="section-title">
          <span>FLUX D'EXÉCUTION AUTONOME</span>
          <span id="agent-step-indicator" class="step-pill">Prêt</span>
        </div>
        <div id="agent-terminal" class="terminal-box"></div>
      </div>

      <div class="hud-section prompt-section">
        <div class="section-title">
          <span>ORDRE ARCHITECTURAL (SANS LIMITE DE LIGNES NI DE FICHIERS)</span>
        </div>
        <textarea
          id="hud-prompt-input"
          placeholder="Décris la fonctionnalité ou le bug à résoudre. L'agent explore l'arborescence, coche les fichiers requis, modifie ou réécrit le code en XML brut, pousse un commit atomique et vérifie la CI GitHub Actions..."
        ></textarea>

        <div class="action-row">
          <button id="btn-execute-agent" class="btn-primary">⚡ LANCER L'AGENT AUTONOME</button>
          <button id="btn-stop-agent" class="btn-danger hidden">⏹ STOPPER LE CYCLE</button>
        </div>
      </div>

      <div class="hud-section files-section">
        <div class="section-title">
          <span>ARBORESCENCE (Sélection auto par IA ou manuelle)</span>
          <div class="mini-actions">
            <button id="btn-uncheck-all" class="btn-mini">Tout décocher</button>
            <button id="btn-refresh-tree" class="btn-mini">🔄</button>
          </div>
        </div>
        <div id="hud-file-list" class="file-list"></div>
      </div>

      <div class="hud-section backup-section">
        <div class="section-title">
          <span>POINTS DE RESTAURATION GIT (TAGS)</span>
          <button id="btn-create-tag" class="btn-mini">+ Créer Tag</button>
        </div>
        <div id="hud-tag-list" class="tag-list"></div>
      </div>
    </aside>
  </main>

  <div id="settings-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3>Configuration des Accès API</h3>
      <label>
        <span>Token GitHub (PAT avec droits <code>repo</code> et <code>workflow</code>) :</span>
        <input type="password" id="input-gh-token" placeholder="ghp_..." />
      </label>
      <label>
        <span>Clé API Google Gemini (AI Studio / Pro) :</span>
        <input type="password" id="input-gemini-key" placeholder="AIzaSy..." />
      </label>
      <div class="modal-actions">
        <button id="btn-close-settings" class="btn-secondary">Annuler</button>
        <button id="btn-save-settings" class="btn-primary">Sauvegarder & Charger</button>
      </div>
    </div>
  </div>

  <!-- CHARGEMENT MODULAIRE DE APP.JS + VÉRIFICATEUR D'INTÉGRITÉ DES FICHIERS -->
  <script src="./app.js?v=6.0"></script>
  <script>
    window.addEventListener("load", () => {
      const diag = document.getElementById("boot-diag");
      const errors = [];
      const bg = window.getComputedStyle(document.body).backgroundColor;
      if (bg === "rgba(0, 0, 0, 0)" || bg === "rgb(255, 255, 255)") {
        errors.push("❌ style.css n'est pas chargé (attendu à : " + new URL("./style.css", location.href).href + "). Vérifie que le fichier s'appelle exactement 'style.css' en minuscules au même niveau que index.html.");
      }
      if (!window.__NDH_BOOTED__) {
        errors.push("❌ app.js n'est pas chargé ou a planté (attendu à : " + new URL("./app.js", location.href).href + "). Vérifie que 'app.js' est bien au même niveau que index.html.");
      }
      if (errors.length > 0) {
        diag.style.display = "block";
        diag.innerHTML = errors.join("<br>");
      }
    });
  </script>
</body>
</html>
