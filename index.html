<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neural Dev Hub V6.0 - Autonomous Agentic IDE</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
</head>
<body>

  <!-- Conteneur WebGL 3D -->
  <div id="3d-graph"></div>

  <!-- Barre supérieure : Authentification et sélection du dépôt -->
  <div id="top-bar" class="hud-panel">
    <div class="brand">Neural Dev Hub V6.0</div>
    <input type="password" id="gh-token" placeholder="GitHub PAT (repo, workflow)" class="input-credential" />
    <input type="password" id="gemini-key" placeholder="Gemini API Key" class="input-credential" />
    <button id="btn-connect" onclick="initHub()">Connecter</button>
    
    <select id="repo-select" onchange="loadRepoTree()" disabled>
      <option value="">-- Sélectionner un dépôt --</option>
    </select>
    
    <input type="text" id="branch-input" value="main" placeholder="Branche" class="input-branch" />
    
    <label class="checkbox-label">
      <input type="checkbox" id="auto-heal-toggle" checked /> Auto-Heal CI/CD (Max 3)
    </label>
    
    <span id="ci-status" class="status-badge">IDLE</span>
  </div>

  <!-- Panneau de pilotage et logs -->
  <div id="control-panel" class="hud-panel">
    <div class="panel-header">INSTRUCTION AGENTIQUE (ZÉRO-JSON XML)</div>
    <textarea id="prompt-input" placeholder="Décris la fonctionnalité à développer, le bug à corriger ou le refactoring à exécuter..."></textarea>
    
    <div class="action-row">
      <button id="btn-run" onclick="triggerAutonomousCycle()" class="btn-primary" disabled>Exécuter Mission Autonome</button>
      <button onclick="recenterCortex()" class="btn-secondary">Focus CORTEX</button>
    </div>
    
    <div class="sub-header">FLUX D'EXÉCUTION & LOGS TEMPS RÉEL</div>
    <div id="terminal"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
